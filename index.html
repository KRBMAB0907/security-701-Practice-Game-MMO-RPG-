<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security+ RPG</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game" width="320" height="180"></canvas>

  <p id="status">Loading questions...</p>

  <div id="mode-panel" hidden>
    <p>Choose your difficulty:</p>
    <button data-mode="fun">Fun: no timer, weaker enemies</button>
    <button data-mode="learner">Learner: 60 seconds per question (recommended)</button>
    <button data-mode="hard">Hard: 30 seconds, tougher enemies, better loot</button>
  </div>

  <div id="class-panel" hidden>
    <p id="class-intro"></p>
    <div id="class-list"></div>
    <div class="small-buttons">
      <button id="class-cancel-button">Keep my class</button>
    </div>
  </div>

  <div id="map-panel" hidden>
    <p id="player-summary"></p>
    <div id="area-list"></div>
    <p id="area-title"></p>
    <div id="zone-list"></div>
    <div class="small-buttons">
      <button id="change-mode-button">Change difficulty</button>
      <button id="gear-button">Gear</button>
      <button id="tree-button">Skill tree</button>
      <button id="change-class-button">Change class</button>
      <button id="reset-button">Reset progress</button>
    </div>
  </div>

  <div id="gear-panel" hidden>
    <div id="paper-doll">
      <canvas id="doll-canvas" width="16" height="16"></canvas>
      <div id="doll-slots"></div>
    </div>
    <p id="gear-summary"></p>
    <div id="gear-list"></div>
    <div class="small-buttons">
      <button id="gear-back-button">Back to map</button>
    </div>
  </div>

  <div id="tree-panel" hidden>
    <p id="tree-summary"></p>
    <p id="tree-help">Click a node to plan a point, then Lock in. Taking points back out costs levels, like switching class.</p>
    <div class="small-buttons">
      <button id="tree-save-button">Lock in points</button>
      <button id="tree-undo-button">Undo planned</button>
      <button id="tree-reset-button">Reset tree</button>
      <button id="tree-back-button">Back to map</button>
    </div>
    <div id="tree-branches"></div>
  </div>

  <div id="battle-panel" hidden>
    <p id="mode-label"></p>
    <p id="battle-log"></p>
    <div id="loot-message"></div>

    <div id="skills"></div>

    <div id="question-area" hidden>
      <div id="timer">
        <div id="timer-track"><div id="timer-bar"></div></div>
        <span id="timer-text"></span>
      </div>
      <p id="question-text"></p>
      <div id="choices"></div>
      <p id="feedback"></p>
    </div>

    <button id="next-button" hidden>Continue</button>
    <button id="map-button" hidden>Back to map</button>
  </div>

  <!-- Order matters: settings and state first, main.js (which starts the game) last -->
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/leveling.js"></script>
  <script src="js/classes.js"></script>
  <script src="js/loot.js"></script>
  <script src="js/skilltree.js"></script>
  <script src="js/dialogue.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/render.js"></script>
  <script src="js/map.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
